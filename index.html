<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بديل — مبدّل حسابات الألعاب</title>
    <meta
      name="description"
      content="بديل مبدّل حسابات لسبع منصّات ألعاب، بدّل بضغطة واحدة بدون كلمة سر، وكل جلسة مشفّرة بـ AES-256 ومربوطة بجهازك وحده، مجاني ومفتوح المصدر."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e1219" />
    <link rel="canonical" href="https://ryanathlawi.github.io/badeel-site/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ryanathlawi.github.io/badeel-site/" />
    <meta property="og:site_name" content="badeel" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:title" content="بديل — مبدّل حسابات الألعاب" />
    <meta
      property="og:description"
      content="بدّل بين حساباتك في ستيم وباتل نت ورايوت وإيبك ويوبيسوفت وروكستار وجوج بضغطة واحدة، بدون كلمة سر، وبتشفير مربوط بجهازك."
    />
    <meta property="og:image" content="https://ryanathlawi.github.io/badeel-site/img/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="بديل — مبدّل حسابات الألعاب" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var q = new URLSearchParams(location.search);
          var l =
            q.get("lang") ||
            localStorage.getItem("bd-lang") ||
            ((navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en");
          if (l !== "en") l = "ar";
          if (q.has("lang")) localStorage.setItem("bd-lang", l);
          d.lang = l;
          d.dir = l === "ar" ? "rtl" : "ltr";
          d.dataset.lang = l;
          if (l === "en") {
            document.title = "badeel — game account switcher";
            var m = document.querySelector('meta[name="description"]');
            if (m)
              m.setAttribute(
                "content",
                "badeel switches between your accounts on seven game platforms in one click, with no password. Every session is sealed with AES-256 and bound to your machine alone. Free and open source.",
              );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
